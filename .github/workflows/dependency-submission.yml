name: Dependency submission

# Uploads the resolved Gradle dependency graph so Dependabot alerts cover the runtime dependencies
# invirt ships (http4k, Jackson, Netty, the MongoDB and Kafka clients), not only the docs site's npm lockfile.
# GitHub cannot read a Gradle build on its own; without this submission the dependency graph holds zero Maven packages.

permissions:
  contents: write

on:
  push:
    branches:
      - "main"

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        # The graph is scoped to what invirt ships. buildSrc, the buildscript `classpath` configuration, the
        # Dokka documentation toolchain and the test-only classpaths are build tooling: none of them reaches a
        # published POM, so an alert raised against them names a risk no consumer of invirt is exposed to.
        # Both values are regular expressions matched against the whole project path or configuration name.
        with:
          dependency-graph-exclude-projects: ':buildSrc'
          dependency-graph-exclude-configurations: '^classpath$|.*[Dd]okka.*|.*[Tt]est(Compile|Runtime)Classpath'
